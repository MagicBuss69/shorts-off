<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shorts Off</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="brand">
          <img src="icons/icon48.png" alt="" width="32" height="32" class="brand-icon" />
          <div>
            <h1 class="title">Shorts Off</h1>
            <p id="status-text" class="subtitle">Loading status…</p>
          </div>
        </div>

        <label class="switch" aria-label="Toggle Shorts Off">
          <input id="enabled-toggle" type="checkbox" role="switch" checked />
          <span class="slider"></span>
        </label>
      </header>

      <section class="card" aria-live="polite">
        <div class="stat-row">
          <span class="stat-label">Current tab</span>
          <span id="tab-summary" class="stat-value">Checking…</span>
        </div>
        <ul class="feature-list">
          <li>Hides Shorts shelves, cards &amp; sidebar buttons</li>
          <li>Redirects <code>/shorts/</code> links to <code>/watch?v=</code></li>
          <li>Blocks autoplay from dropping into Shorts</li>
        </ul>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
